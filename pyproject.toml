[project]
name = "latencymesh"
version = "0.2.0.dev0"
description = "Vyper contracts for a network of witnesses chosen by network distance (RTT), with a titanoboa test harness for simulating scenarios and attacks."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Paweł Wilczyński", email = "pawel@wilczynski.opole.pl" }]
requires-python = ">=3.11"
dependencies = ["titanoboa>=0.2.6", "pyyaml>=6"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Networking",
    "Topic :: Scientific/Engineering",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.10", "types-PyYAML"]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/latencymesh"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --cov=latencymesh --cov-branch --cov-report=term-missing"

[tool.coverage.run]
source = ["latencymesh"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "\\.\\.\\."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"src/latencymesh/networks/**" = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tools"]

[[tool.mypy.overrides]]
module = ["boa", "boa.*"]
ignore_missing_imports = true
