# milky-way genesis: the trusted starting set of nodes.
#
# One node per public cloud region of the three largest providers. Every entry is a
# region where a small (free or lowest-tier) virtual machine can be rented today, so
# this genesis can be deployed for real.
#
# `city` is the metro area the provider publishes for the region; lat/lon are the
# coordinates of that city, not of a datacenter.
#
# Not included yet (see ROADMAP.md): the remaining cloud regions, a node in every
# country, and edge networks such as Cloudflare where the location of a workload
# cannot be pinned to one place.
name: milky-way
